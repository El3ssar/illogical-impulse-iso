# Illogical Impulse ISO — GTK4 coherence (#26 / PROPOSAL §9).
#
# Same orthogonal-to-matugen contract as gtk-3.0/settings.ini: matugen owns the
# COLOR css (~/.config/gtk-4.0/gtk.css, rsync --delete territory, never touched);
# this file sets only the theme/icon/cursor NAMES. GTK4 apps still honor the
# icon + cursor names here even though adw-gtk3's widget styling targets GTK3 —
# libadwaita apps use their own widgets but pick up the icon theme and cursor.
#
# UNOWNED seam (upstream ships no gtk-4.0/settings.ini). Revert = delete → GTK
# falls back to system defaults; matugen colors persist.
[Settings]
gtk-theme-name=adw-gtk3
gtk-icon-theme-name=Papirus-Dark
gtk-cursor-theme-name=Bibata-Modern-Classic
gtk-cursor-theme-size=24
gtk-application-prefer-dark-theme=true
