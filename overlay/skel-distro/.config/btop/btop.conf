# Illogical Impulse — btop config (installed-user skel default).
#
# UNOWNED seam: upstream ships no ~/.config/btop, so this never collides with or
# is wiped by upstream's rsync --delete. It only points btop at the baked "ii"
# theme (themes/ii.theme, Catppuccin Mocha cold-start) and keeps everything else
# at btop's own defaults. Delete ~/.config/btop to fall back to btop's defaults.
color_theme = "ii"
theme_background = True
truecolor = True
vim_keys = True
rounded_corners = True
