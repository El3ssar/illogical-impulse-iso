# Illogical Impulse ISO — GTK3 coherence (#26 / PROPOSAL §9).
#
# ORTHOGONAL to matugen. Upstream's matugen pipeline owns the COLOR css it
# rsync --delete's into ~/.config/gtk-3.0/gtk.css (never touched here). This file
# sets only the widget-theme / icon / cursor NAMES — selectors matugen never
# writes — so the two compose: adw-gtk3 gives Adwaita-shaped widgets, Papirus the
# icons, Bibata the cursor, while gtk.css keeps tracking the wallpaper accent.
#
# UNOWNED seam: upstream ships no gtk-3.0/settings.ini and no ~/.icons, so this is
# a pure baked skel default (installed users only — skel-distro is not seeded to
# liveuser). Revert = delete this file; GTK falls back to system defaults and the
# matugen colors keep working. No ledger entry needed (pure additive skel).
[Settings]
gtk-theme-name=adw-gtk3
gtk-icon-theme-name=Papirus-Dark
gtk-cursor-theme-name=Bibata-Modern-Classic
gtk-cursor-theme-size=24
gtk-application-prefer-dark-theme=true
