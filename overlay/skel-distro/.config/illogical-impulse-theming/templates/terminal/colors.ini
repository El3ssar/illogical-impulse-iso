# Illogical Impulse ISO — Material You colours for extra terminals (#26 / §9).
#
# GENERATED by ii-theme-feeder.sh (matugen json <colors.json> --config …). Do NOT
# edit by hand — regenerated on every wallpaper/flavor change from upstream's
# FINISHED colours.json. Upstream themes kitty; this fragment gives foot /
# alacritty / wezterm and other non-kitty terminals the same palette to include.
# The terminal/TUI domain (#23) points its terminal includes at the generated
# copy of this file; nothing forces it on any terminal.

[colors]
background      = {{background}}
foreground      = {{on_background}}
cursor          = {{primary}}
selection_bg    = {{primary_container}}
selection_fg    = {{on_primary_container}}

# Core Material roles (map into your terminal's own palette keys as you like).
primary         = {{primary}}
secondary       = {{secondary}}
tertiary        = {{tertiary}}
error           = {{error}}
surface         = {{surface}}
surface_variant = {{surface_variant}}
outline         = {{outline}}
