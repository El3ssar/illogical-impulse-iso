<?xml version="1.0" encoding="UTF-8"?>
<!-- Generic fallback icon for iictl webapp launchers with no favicon.
     Catppuccin Mocha palette; a simple globe glyph on a mauve rounded square.
     Rasterized to overlay/airootfs/usr/share/illogical-impulse/webapps/fallback.png. -->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#cba6f7"/>
      <stop offset="1" stop-color="#89b4fa"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="56" ry="56" fill="url(#bg)"/>
  <g fill="none" stroke="#11111b" stroke-width="10" stroke-linecap="round">
    <circle cx="128" cy="128" r="74"/>
    <ellipse cx="128" cy="128" rx="34" ry="74"/>
    <line x1="54" y1="128" x2="202" y2="128"/>
    <line x1="68" y1="88" x2="188" y2="88"/>
    <line x1="68" y1="168" x2="188" y2="168"/>
  </g>
</svg>
