# overlay/pacman.conf — HOST-side pacman.conf used by mkarchiso.
#
# mkarchiso reads this to know which repos to pacstrap from. It is NOT
# copied into the ISO; the live/installed system's pacman.conf lives at
# overlay/airootfs/etc/pacman.conf and intentionally omits [ii-extra]
# (that repo only exists on the build host).
#
# [ii-extra] is populated by scripts/prebuild.sh (makepkg + repo-add) and
# must come BEFORE [core]/[extra] so pacman resolves calamares & friends
# from the prebuilt cache first.

[options]
HoldPkg     = pacman glibc
Architecture = auto
ParallelDownloads = 5
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

[ii-extra]
SigLevel = Optional TrustAll
Server = file:///var/cache/ii-extra-repo

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist
