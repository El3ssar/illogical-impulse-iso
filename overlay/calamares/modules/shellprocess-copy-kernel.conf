# shellprocess@copy-kernel.conf
#
# Runs BEFORE Calamares' bootloader module (mkinitcpio + kernels on /boot).
#
# What the script does, in order:
#   1. Sanity-gates the kernel package presence under /usr/lib/modules/.
#   2. Writes /etc/mkinitcpio.conf with universal hooks (no autodetect)
#      so the installed initramfs ships every block-device and fs
#      driver — bulletproof against installing on hardware the live
#      kernel never saw.
#   3. Restores /boot/intel-ucode.img + /boot/amd-ucode.img from the
#      stash that customize_airootfs.sh left at
#      /usr/share/illogical-impulse/boot-stash/  (mkarchiso wipes /boot/*
#      from the airootfs after capturing the live kernel image, so the
#      microcode files would otherwise be missing from the installed
#      system entirely).
#   4. Copies each /usr/lib/modules/<ver>/vmlinuz → /boot/vmlinuz-<pkgbase>.
#   5. Generates /etc/mkinitcpio.d/<pkgbase>.preset for each kernel.
#   6. Runs `mkinitcpio -P` to build all initramfs images.
#   7. Writes /boot/.ii-boot-state.json — read by ii-verify at
#      the end of the install sequence to confirm everything's intact.
#
# Mapped to the "copy-kernel" instance via settings.conf → instances.
---
dontChroot: false
timeout: 600

script:
  - "/usr/local/bin/ii-prepare-bootloader"
