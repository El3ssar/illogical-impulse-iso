# shellprocess@post-install.conf
# Runs post-install inside the installed system's chroot.
#
# The script detects the new user itself via getent passwd (first UID >= 1000).
# Calamares does not reliably pass context variables to shellprocess env,
# so we keep it simple and let the script figure it out.
---
dontChroot: false
# Generous: on NVIDIA machines this includes dkms module builds for two
# kernels (~2-5 min each).
timeout: 1800

script:
  - /usr/local/bin/ii-post-install
