# shellprocess.conf — base no-op config.
#
# This file exists ONLY to override Calamares' upstream example config at
# /usr/share/calamares/modules/shellprocess.conf, which contains a script
# block that tries to execute /usr/local/bin/slowloris (a placeholder
# command that doesn't exist). When we define instance configs like
# `shellprocess@copy-kernel.conf`, Calamares 3.4 still loads the base
# `shellprocess.conf` from somewhere — and if we don't ship one here, it
# falls through to the example. That's how the "slowloris: No such file
# or directory" error appeared at the very end of the install.
#
# We DON'T reference `shellprocess` (no @) in settings.conf, so this
# config never actually executes anything — it's purely a guard against
# the upstream example sneaking into the install path.
---
dontChroot: false
script: []
