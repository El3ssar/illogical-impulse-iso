# mount.conf — Btrfs subvolumes + mount options for install and fstab.
#
# btrfsSubvolumes apply to the ROOT partition only. /home is a separate
# partition (partition.conf) and is mounted directly at /home.
---
extraMounts:
    - device: proc
      fs: proc
      mountPoint: /proc
    - device: sys
      fs: sysfs
      mountPoint: /sys
    - device: /dev
      mountPoint: /dev
      options: [ bind ]
    - device: tmpfs
      fs: tmpfs
      mountPoint: /run
    - device: /run/udev
      mountPoint: /run/udev
      options: [ bind ]
    - device: efivarfs
      fs: efivarfs
      mountPoint: /sys/firmware/efi/efivars
      efi: true

btrfsSubvolumes:
    - mountPoint: /
      subvolume: /@
    - mountPoint: /var/cache
      subvolume: /@cache
    - mountPoint: /var/log
      subvolume: /@log
    # Snapshot-ready layout: snapper (System Extras group) expects this
    # subvolume so snapshots stay out of the rollback set.
    - mountPoint: /.snapshots
      subvolume: /@snapshots

mountOptions:
    - filesystem: default
      options: [ defaults ]
    - filesystem: efi
      options: [ defaults, umask=0077 ]
    - filesystem: btrfs
      options: [ noatime, compress=zstd:3, space_cache=v2 ]
      ssdOptions: [ discard=async ]
