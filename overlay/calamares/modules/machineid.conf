# machineid.conf
# Generates /etc/machine-id (systemd) and /var/lib/dbus/machine-id (dbus)
# on the installed system. Without this, the installed system would
# inherit the squashfs's "uninitialized" machine-id and confuse systemd-
# firstboot into prompting for timezone on first boot.
#
# SCHEMA NOTE: the symlink option was renamed from `symlink:` to
# `dbus-symlink:` in Calamares 3.3. Old key still works with a warning.
---
systemd:      true
systemd-style: uuid
dbus:         true
dbus-symlink: true
