# services-systemd.conf — Calamares services-systemd module.
#
# CRITICAL SCHEMA NOTE: this module uses `units:` (a list of unit entries),
# NOT a `services:` / `targets:` split. Previous versions of this file used
# the wrong keys and Calamares silently dropped every entry, so no service
# got enabled by this module. post-install was carrying the load.
#
# Each entry has:
#   - name      : the unit name (string, with .service/.socket/etc.)
#   - action    : enable | disable | mask | unmask
#   - mandatory : if true, install fails when the action fails (default false)
#
# post-install (called via shellprocess@post-install) still enables
# greetd, bluetooth, sshd, vboxservice — keeping that as the authoritative
# place. Here we only enable NetworkManager because we want it available
# the moment the user reboots into the installed system (no waiting on
# post-install hooks).
---
units:
  - name: "NetworkManager.service"
    action: "enable"
    mandatory: false
