# welcome.conf — Calamares welcome screen + requirements check.
---
showSupportUrl:      true
showKnownIssuesUrl:  true
showReleaseNotesUrl: false
showDonateUrl:       false

requirements:
    requiredStorage:  10
    requiredRam:      1.5
    internetCheckUrl: "https://archlinux.org"
    check:
        - storage
        - ram
        - power
        - internet
        - root
        - screen
    required:
        - storage
        - ram
        - root

# Note: `welcomeStyleCalamares` lives in branding.desc, not here.
# (Calamares evaluates the branding setting; duplicating it here was noise.)
