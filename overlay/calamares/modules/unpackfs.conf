# unpackfs.conf
# Calamares unpacks the live filesystem onto the target. The source is the
# already-mounted squashfs at /run/archiso/airootfs (a directory).
#
# sourcefs notes:
#   "squashfs" → unsquashfs source as a FILE
#   anything else (we use "ext4") → rsync source as a DIRECTORY
# Our source is a directory, so we must NOT say "squashfs" — that's the bug
# that produced "main.py raised an exception" on the previous build.
#
# `exclude` strips live-only assets from the installed system.
# ISO/Calamares scripts MUST be copied here — shellprocess runs them in the
# target chroot AFTER unpackfs. They are purged at the end of ii-verify.
---
unpack:
  - source: "/run/archiso/airootfs"
    sourcefs: "ext4"
    destination: ""
    exclude:
      # ── Live-only service masks ─────────────────────────────────────
      - etc/systemd/system/systemd-firstboot.service
      # ── Live-only login ─────────────────────────────────────────────
      - etc/greetd/config.toml
      - home/liveuser
      - etc/sudoers.d/10-wheel-nopasswd
      # tty2 rescue console autologins root with NO password — a live-ISO-only
      # escalator (see overlay/airootfs/.../getty@tty2.service.d/autologin.conf).
      # If it survives install, Ctrl+Alt+F2 is a passwordless-root backdoor on
      # the installed system, so the whole drop-in dir MUST be excluded; plain
      # getty (password login) then takes over tty2. (SEC-01)
      - etc/systemd/system/getty@tty2.service.d
      # ── Skel layers not for installed users ───────────────────────────
      - etc/skel-upstream
      - etc/skel-live
      # ── Live-only desktop / installer launcher ────────────────────────
      - usr/local/bin/ii-launch-installer
      - usr/local/bin/ii-live-welcome
      - usr/share/applications/install-illogical-impulse.desktop
      - usr/share/applications/calamares.desktop
      - usr/share/applications/calamares-launch-oem.desktop
      # ── Live-only mkinitcpio ──────────────────────────────────────────
      - etc/mkinitcpio.conf.d/archiso.conf
      # ── Live keyring infra (mount unit + its tmpfs) ─────────────────────
      # The tmpfs mount MUST be excluded — if it survives, it hides the real
      # /etc/pacman.d/gnupg directory on the installed system at boot, and
      # pacman signature verification fails. The keyring directory itself is
      # KEPT: customize_airootfs.sh runs `pacman-key --init/--populate` in the
      # chroot, those keys live on disk in the squashfs, and unpackfs copies
      # them to the installed system. pacman -Syu self-heals if it goes stale.
      - etc/systemd/system/pacman-init.service
      - etc/systemd/system/multi-user.target.wants/pacman-init.service
      - etc/systemd/system/etc-pacman.d-gnupg.mount
      - etc/systemd/system/multi-user.target.wants/etc-pacman.d-gnupg.mount
      # ── Build leftovers ───────────────────────────────────────────────
      - root/customize_airootfs.sh
      - root/aur-packages.txt
      - var/log/ii-live
      - var/log/customize_airootfs.log
