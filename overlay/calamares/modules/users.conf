# users.conf — Calamares user account creation.
---
defaultGroups:
  - name: users
    must_exist: false
    system: false
  - name: lp
    must_exist: false
    system: false
  - name: video
    must_exist: false
    system: false
  - name: network
    must_exist: false
    system: false
  - name: storage
    must_exist: false
    system: false
  - name: wheel
    must_exist: false
    system: false
  - name: audio
    must_exist: false
    system: false
  - name: input
    must_exist: false
    system: false

sudoersGroup: wheel

setRootPassword: true
doReusePassword: true
doAutologin: false

# INST-01: must be a shell that actually ships (see packages/base.list). fish is
# upstream's tested, themed default and the locked distro default (PROPOSAL §5);
# the GUIDE fizsh recipe is hypothetical — its value must never leak in here.
userShell: /usr/bin/fish

# Relaxed password policy — live ISO install should not feel like enterprise LDAP.
passwordRequirements:
  minLength: 4
  maxLength: -1
