# users.conf — Calamares user account creation.
---
defaultGroups:
  - name: users
    must_exist: false
    system: false
  - name: lp
    must_exist: false
    system: false
  - name: video
    must_exist: false
    system: false
  - name: network
    must_exist: false
    system: false
  - name: storage
    must_exist: false
    system: false
  - name: wheel
    must_exist: false
    system: false
  - name: audio
    must_exist: false
    system: false
  - name: input
    must_exist: false
    system: false

sudoersGroup: wheel

setRootPassword: true
doReusePassword: true
doAutologin: false

userShell: /usr/bin/fizsh

# Relaxed password policy — live ISO install should not feel like enterprise LDAP.
passwordRequirements:
  minLength: 4
  maxLength: -1
