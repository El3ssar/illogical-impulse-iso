# partition.conf — UEFI + GPT, separate root and home, optional hibernation swap.
#
# Layout (erase disk, UEFI):
#   EFI  — FAT32, 1 GiB, /boot/efi
#   root — Btrfs, ~100 GiB, /              (subvolume @ — see mount.conf)
#   home — Btrfs, remainder, /home          (separate partition, NOT a subvol of root)
#
# Swap:
#   default  — zram only (systemd-zram-generator)
#   suspend  — disk swap partition (~RAM) + zram
---
defaultPartitionTableType: gpt

efi:
    mountPoint:      "/boot/efi"
    recommendedSize: 1GiB
    minimumSize:     512MiB
    label:           "EFI"

userSwapChoices:
  - none      # zram only
  - small     # small disk swap (overflow)
  - suspend   # swap ≥ RAM — hibernation (resume= wired by ii-finish-systemd-boot)
  - file      # swapfile instead of a partition

initialSwapChoice: none

luksGeneration: luks2

drawNestedPartitions:      false
alwaysShowPartitionLabels: true
allowManualPartitioning:   true
initialPartitioningChoice: none

# Separate partitions — root and /home must NOT share one disk partition.
partitionLayout:
    - name: "root"
      type: "4f68bce3-e8cd-4db1-96e7-fbcaf984b709"
      filesystem: "btrfs"
      mountPoint: "/"
      size: 100GiB
      minSize: 80GiB
      maxSize: 200GiB
    - name: "home"
      type: "933ac7e1-2eb4-4f13-b844-0e14e2aef915"
      filesystem: "btrfs"
      mountPoint: "/home"
      size: 100%
      minSize: 5GiB
