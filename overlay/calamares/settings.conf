# Calamares settings.conf
# Defines the full install sequence for Illogical Impulse.
#
# CRITICAL @-INSTANCE PITFALL (stalled the project for days):
# When you reference `shellprocess@copy-kernel` in the sequence below,
# Calamares looks up which config file to use via the `instances:` block.
# WITHOUT a matching `instances:` entry, Calamares silently falls back to
# `<module>.conf` — every `shellprocess@*` instance loads the same
# shellprocess.conf regardless of the @-suffix. The per-instance file
# naming has NOTHING to do with @ in filenames; it's only the `id:`
# under `instances:` that maps.
#
# See src/libcalamares/Settings.cpp:77 in the Calamares source.
---
modules-search: [local, /usr/lib/calamares/modules]

# Per-instance config file mapping. Each `id:` matches a `@<id>` reference
# in the sequence below.
#
# Order: copy-kernel → bootloader → finish-boot → post-install → verify-install
instances:
  - id:     copy-kernel
    module: shellprocess
    config: shellprocess-copy-kernel.conf
  - id:     finish-boot
    module: shellprocess
    config: shellprocess-finish-boot.conf
  - id:     post-install
    module: shellprocess
    config: shellprocess-post-install.conf
  - id:     verify-install
    module: shellprocess
    config: shellprocess-verify-install.conf

sequence:
  # ── GUI phase: user clicks through these screens ───────────────────────────
  - show:
    - welcome       # requirements check + product info
    - locale        # timezone + language selection
    - keyboard      # keyboard layout
    - partition     # disk partitioning
    - users         # username, password, hostname
    - summary       # review before committing

  # ── Exec phase: silent work after user clicks Install ──────────────────────
  - exec:
    - partition           # format disk + create partitions
    - mount               # mount target + bind-mount proc/sys/dev for chroot
    - unpackfs            # copy squashfs onto the mounted disk (the big step)
    - machineid           # generate unique /etc/machine-id
    - fstab               # write /etc/fstab
    - locale              # write /etc/locale.conf
    - keyboard            # write /etc/vconsole.conf + X11 keyboard config
    - localecfg           # run locale-gen
    - users               # create user account (triggers skel copy → dotfiles in home)
    - networkcfg          # write /etc/hostname + /etc/hosts
    - hwclock             # write /etc/adjtime (UTC)
    - services-systemd    # enable NetworkManager (others via shellprocess)

    # ── Bootloader prep: mkinitcpio + kernels on /boot (before systemd-boot).
    - shellprocess@copy-kernel

    # ── Install systemd-boot to ESP (/boot/efi).
    - bootloader

    # ── Patch loader entries: rootflags, LUKS, resume= for hibernation.
    - shellprocess@finish-boot

    # ── Post-install: greetd, rice setup, remove live-only shortcuts.
    - shellprocess@post-install

    # ── Sanity gate: /boot artefacts, systemd-boot, fstab, greetd.
    - shellprocess@verify-install

    - umount              # cleanly unmount everything

  # ── Final screen ───────────────────────────────────────────────────────────
  - show:
    - finished

branding: illogical-impulse

prompt-install:               true
dont-chroot:                  false
oem-setup:                    false
disable-cancel:               false
disable-cancel-during-exec:   true
hide-back-and-next-during-exec: true
quit-at-end:                  false
