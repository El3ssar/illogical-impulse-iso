# mkinitcpio hook list for the LIVE ISO initramfs.
#
# Order matters. This list is archiso's releng default MINUS the PXE
# hooks (we don't network-boot) and intentionally WITHOUT plymouth.
#
# Why no plymouth on the live ISO right now:
#   plymouth+universal-initramfs combinations have proven fragile on
#   real laptops — when the splash fails to paint, the screen stays
#   black and the user has no signal whether the kernel is booting or
#   stuck. Without plymouth in the initramfs the kernel boot is
#   visible from the moment GRUB hands off. Polish (Plymouth) is a
#   second pass once everything else is rock-solid.
#
# PXE hooks dropped — releng ships archiso_pxe_common /
# archiso_pxe_nbd / archiso_pxe_http / archiso_pxe_nfs for
# network-boot scenarios we don't support. The nbd hook depends on
# the `nbd-client` binary from a package we don't pacstrap; without
# removing it mkinitcpio aborts with:
#     ==> ERROR: binary not found: 'nbd-client'
# and the initramfs is incomplete.
#
# memdisk hook dropped — it needs `memdiskfind` from syslinux, which
# prepare.sh strips from packages.x86_64 (UEFI systemd-boot only).
# Without removing it mkinitcpio warns:
#     ==> ERROR: binary not found: 'memdiskfind'
# Normal live boot uses archiso + archiso_loop_mnt, not copytoram/memdisk.
#
# Hook glossary:
#   base / udev       — minimal init + device hotplug
#   microcode         — early CPU microcode loading
#   modconf           — load kernel-module configs from /etc/modprobe.d/
#   kms               — kernel-mode-setting graphics drivers
#   archiso           — the actual ISO mount logic (finds airootfs)
#   archiso_loop_mnt  — fallback: loop-mount the ISO if archiso can't find it
#   block             — *critical*: SATA/AHCI/NVMe/USB-mass-storage drivers
#   filesystems       — fs drivers (iso9660, ext4, vfat, ...)
#   keyboard          — keyboard input in early boot (rescue shell needs it)
HOOKS=(base udev microcode modconf kms archiso archiso_loop_mnt block filesystems keyboard)

COMPRESSION="xz"
COMPRESSION_OPTIONS=(-9e)
