# Rescue: tty2 always autologins root with no password prompt.
# If greetd / Hyprland fail on real hardware, Ctrl+Alt+F2 from anywhere
# guarantees a working shell to read logs from.
[Service]
ExecStart=
ExecStart=-/sbin/agetty -o '-p -f -- \\u' --skip-login --nonewline --noissue --autologin root --noclear %I $TERM
