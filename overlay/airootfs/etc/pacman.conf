# pacman.conf for the LIVE and INSTALLED systems.
#
# Mirrors the host-side overlay/pacman.conf BUT omits the [ii-extra]
# entry: that repo lives only on the build host's /var/cache/ii-extra-repo
# and is not shipped in the ISO.

[options]
HoldPkg     = pacman glibc
Architecture = auto
ParallelDownloads = 5
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist
